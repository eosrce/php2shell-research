; 128M memory_limit with post_max_size 8M: the "T2 quadrant" (post < mem).
; Bodies must be sent chunked (no Content-Length) so PHP skips the
; post_max_size guard.  Verified 2026-10-24 on php:8.3.35-apache and
; php:8.5.11-apache: both reach a full PROOF with the default stage-3 geometry.
; 8.4.26 official is the only build that is still blocked (docs/research/t2-t3.md §6, docs/research/t2-t3.md §1).
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 8M
max_input_vars = 1000

session.save_path = "/tmp"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = On
