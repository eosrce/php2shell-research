services:
  target:
    # Official Docker image; override with PHP_IMAGE for a patched negative control.
    #   https://github.com/docker-library/php  (tag 8.4.26-apache)
    image: ${PHP_IMAGE:-php:8.4.26-apache}
    platform: linux/amd64
    container_name: ${LAB_NAME:-php2shell-target}
    ports:
      - "127.0.0.1:${LAB_PORT:-8088}:80"
    volumes:
      - ${PHP_INI:-./php.ini}:/usr/local/etc/php/conf.d/zz-php2shell.ini:ro
      - ${APACHE_CONF:-./apache.conf}:/etc/apache2/conf-enabled/zz-php2shell.conf:ro
      - ./www:/var/www/html:ro
      - ${OUT_DIR:-../out}:/out
    # The old command chowned /out to www-data, which locked the host user out
    # of out/offsets.env.  0777 lets both the web worker and the invoking user
    # write, so offsets and the proof file can coexist.
    command:
      - /bin/sh
      - -c
      - chmod -R 0777 /out 2>/dev/null || true; exec apache2-foreground
    restart: unless-stopped
