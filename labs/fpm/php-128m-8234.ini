; PHP 8.2.34 FPM 128M lab profile for the pure-HTTP chain (lab-only).
; 8.2.34 is pre-fix for CVE-2026-109618 / CVE-2026-109619 (fixed in 8.2.35),
; so this profile belongs to the real-CVE quadrant; see
; docs/research/fpm-8234-port.md.
;
; This is a copy of php-128m.ini with session.upload_progress.cleanup = Off.
; The same cleanup=Off requirement applies to the 8.5.11 lab; override it via
; a conf.d file (e.g. /usr/local/etc/php/conf.d/zz-r41-lab.ini) instead of
; editing the shared php-128m.ini in place.
display_errors = Off
display_startup_errors = Off
error_reporting = E_ALL
memory_limit = 128M
post_max_size = 8M
upload_max_filesize = 8M
max_input_vars = 1000
session.save_path = "/var/lib/php/sessions"
session.use_strict_mode = 0
session.use_cookies = 1
session.upload_progress.enabled = On
session.upload_progress.cleanup = Off
